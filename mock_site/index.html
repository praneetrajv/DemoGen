<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeevCloud console</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14171c;color:#e6e9ee;
  font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5}
main{max-width:44ch;padding:32px}
.mark{display:flex;align-items:baseline;gap:8px;font-size:19px;font-weight:640;letter-spacing:-.015em;margin-bottom:22px}
.mark span{width:9px;height:9px;background:#f0a028;border-radius:1px;transform:translateY(-2px)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
p{color:#8a93a1;margin:0 0 26px}
a{display:inline-block;background:#f0a028;color:#1a1206;font-weight:600;text-decoration:none;
  padding:11px 20px;border-radius:3px}
a:hover{background:#ffb844}
a:focus-visible{outline:2px solid #f0a028;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mark"><span></span>NeevCloud</div>
  <h1>Local demo environment</h1>
  <p>A stand-in GPU console used to record and verify DemoGen runs without touching a real
     account. Nothing here talks to a backend.</p>
  <a href="/dashboard.html">Open fleet allocation</a>
</main>
</body>
</html>
